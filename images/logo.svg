<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 8 44 30" width="44" height="30">
  <!-- «Орбита»: a planet, a tilted orbit ring and a satellite.
       The back half of the ring is drawn before the planet and hides behind it;
       the front half is drawn after it, with a gap cut out of the planet by a mask. -->
  <defs>
    <mask id="ring-gap">
      <rect x="0" y="0" width="48" height="48" fill="#fff"/>
      <path d="M3 24A21 5.5 0 0 0 45 24" transform="rotate(-24 24 24)" fill="none" stroke="#000" stroke-width="5.5"/>
    </mask>
  </defs>
  <path d="M45 24A21 5.5 0 0 0 3 24" transform="rotate(-24 24 24)" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="24" r="12" fill="#F2551B" mask="url(#ring-gap)"/>
  <g transform="rotate(-24 24 24)" fill="#fff">
    <path d="M3 24A21 5.5 0 0 0 45 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="42.19" cy="21.25" r="3.4"/>
  </g>
</svg>
